# Generated by build/build_readme.py - refreshes the Latest Posts block of README.md
# from the Naver blog RSS feed. Needs Settings > Actions > General > Workflow permissions
# set to "Read and write"; run once by hand (workflow_dispatch) after the first push.
name: Latest blog posts

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with the latest Naver blog posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        env:
          TZ: Asia/Seoul
        with:
          feed_list: "https://rss.blog.naver.com/shuai020504.xml"
          max_post_count: 5
          comment_tag_name: "BLOG-POST-LIST"
          template: "- [$title]($url) <sub>$date</sub>$newline"
          date_format: "yyyy.mm.dd"
          commit_message: "docs: update latest Naver blog posts"
